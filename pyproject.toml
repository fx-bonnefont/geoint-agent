[project]
name = "geoint-agent"
version = "0.1.0"
description = "Detects ships in Sentinel-1 SAR imagery and cross-checks them against AIS to produce sourced intelligence notes."

readme = "README.md"
authors = [
    { name = "François-Xavier Bonnefont", email = "bonnefontfx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
geoint-agent = "geoint_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
