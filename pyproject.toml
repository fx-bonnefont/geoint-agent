[project]
name = "geoint-agent"
version = "0.1.0"
description = "Detects ships in Sentinel-1 SAR imagery and cross-checks them against AIS to produce sourced intelligence notes."

readme = "README.md"
authors = [
    { name = "François-Xavier Bonnefont", email = "bonnefontfx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
geoint-agent = "geoint_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
